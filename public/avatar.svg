<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="50%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="120" cy="120" r="116" fill="url(#avatar-bg)"/>

  <!-- Back Hair -->
  <path d="M60 135 C55 180, 70 210, 85 220 L155 220 C170 210, 185 180, 180 135 C180 75, 60 75, 60 135 Z" fill="url(#hair-grad)"/>

  <!-- Neck -->
  <path d="M106 142 L134 142 L134 165 C134 172, 106 172, 106 165 Z" fill="#FBD5C0"/>
  <!-- Neck shadow -->
  <path d="M106 142 C114 150, 126 150, 134 142 L134 149 C125 155, 115 155, 106 149 Z" fill="#F2BCA2"/>

  <!-- Hoodie / Clothes -->
  <path d="M54 228 C56 188, 80 166, 104 162 L112 188 L128 188 L136 162 C160 166, 184 188, 186 228 Z" fill="url(#hoodie-grad)" filter="url(#shadow)"/>
  <!-- Hoodie Collar / V-neck -->
  <path d="M102 163 L120 190 L138 163 C131 168, 109 168, 102 163 Z" fill="#4338CA"/>
  <!-- Hoodie Drawstrings -->
  <path d="M112 188 L110 208 M128 188 L130 208" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Head / Face -->
  <rect x="88" y="82" width="64" height="74" rx="32" fill="#FFE0CE"/>

  <!-- Cheeks blush -->
  <ellipse cx="98" cy="126" rx="6" ry="3.5" fill="#F472B6" fill-opacity="0.35"/>
  <ellipse cx="142" cy="126" rx="6" ry="3.5" fill="#F472B6" fill-opacity="0.35"/>

  <!-- Eyes -->
  <ellipse cx="104" cy="116" rx="3.5" ry="4" fill="#27272A"/>
  <ellipse cx="136" cy="116" rx="3.5" ry="4" fill="#27272A"/>
  <!-- Catchlight in eyes -->
  <circle cx="103" cy="114.5" r="1.3" fill="white"/>
  <circle cx="135" cy="114.5" r="1.3" fill="white"/>

  <!-- Eyebrows -->
  <path d="M99 107 C103 105, 109 106, 111 108" stroke="#3F3F46" stroke-width="2" stroke-linecap="round"/>
  <path d="M129 108 C131 106, 137 105, 141 107" stroke="#3F3F46" stroke-width="2" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M113 131 C117 136, 123 136, 127 131" stroke="#E11D48" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Modern Glasses -->
  <rect x="94" y="108" width="20" height="15" rx="5" fill="none" stroke="#4F46E5" stroke-width="2.2"/>
  <rect x="126" y="108" width="20" height="15" rx="5" fill="none" stroke="#4F46E5" stroke-width="2.2"/>
  <path d="M114 115 L126 115" stroke="#4F46E5" stroke-width="2"/>

  <!-- Bangs / Front Hair -->
  <path d="M84 94 C90 74, 150 74, 156 94 C158 106, 154 118, 152 120 C150 102, 142 90, 128 92 C116 93, 112 100, 106 100 C98 100, 92 106, 88 120 C86 118, 82 106, 84 94 Z" fill="url(#hair-grad)"/>

  <!-- Cute Hairclip / Star -->
  <g transform="translate(142, 88)">
    <circle cx="5" cy="5" r="5" fill="url(#accent-grad)"/>
    <path d="M5 2 L5 8 M2 5 L8 5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>