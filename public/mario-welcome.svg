<svg width="240" height="90" viewBox="0 0 240 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mario Pixel/Retro Silhouette & Head -->
  <g transform="translate(10, 12)">
    <!-- Red Cap -->
    <rect x="12" y="4" width="32" height="12" fill="#E60012" stroke="#21242E" stroke-width="2"/>
    <rect x="24" y="0" width="28" height="8" fill="#E60012" stroke="#21242E" stroke-width="2"/>
    <!-- White 'M' Emblem Circle -->
    <circle cx="28" cy="8" r="6" fill="#FFFFFF" stroke="#21242E" stroke-width="1.5"/>
    <text x="28" y="11" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#E60012" text-anchor="middle">M</text>
    
    <!-- Face / Skin -->
    <rect x="16" y="16" width="28" height="20" fill="#FED7AA" stroke="#21242E" stroke-width="2"/>
    <!-- Big Nose -->
    <ellipse cx="38" cy="24" rx="7" ry="6" fill="#FED7AA" stroke="#21242E" stroke-width="2"/>
    <!-- Eye -->
    <ellipse cx="28" cy="20" rx="3" ry="5" fill="#21242E"/>
    <circle cx="27" cy="18" r="1" fill="#FFFFFF"/>
    <!-- Mustache -->
    <path d="M22 28 C26 25, 34 25, 42 27 C46 29, 44 34, 38 34 C32 34, 28 32, 22 28 Z" fill="#21242E"/>
    <!-- Sideburn / Hair -->
    <rect x="10" y="18" width="8" height="14" fill="#6B4226" stroke="#21242E" stroke-width="1.5"/>
    <circle cx="10" cy="26" r="4" fill="#FED7AA" stroke="#21242E" stroke-width="1.5"/>

    <!-- Red Shirt & Overalls Straps -->
    <rect x="12" y="36" width="36" height="24" fill="#E60012" stroke="#21242E" stroke-width="2"/>
    <rect x="18" y="40" width="10" height="20" fill="#1D4ED8" stroke="#21242E" stroke-width="2"/>
    <rect x="34" y="40" width="10" height="20" fill="#1D4ED8" stroke="#21242E" stroke-width="2"/>
    <!-- Yellow Overalls Buttons -->
    <circle cx="23" cy="46" r="2.5" fill="#FDE047" stroke="#21242E" stroke-width="1"/>
    <circle cx="39" cy="46" r="2.5" fill="#FDE047" stroke="#21242E" stroke-width="1"/>

    <!-- Waving White Glove Hand -->
    <g transform="translate(48, 6) rotate(15)">
      <circle cx="8" cy="8" r="8" fill="#FFFFFF" stroke="#21242E" stroke-width="2"/>
      <rect x="0" y="4" width="6" height="4" rx="2" fill="#FFFFFF" stroke="#21242E" stroke-width="1.5"/>
      <rect x="4" y="0" width="4" height="6" rx="2" fill="#FFFFFF" stroke="#21242E" stroke-width="1.5"/>
      <rect x="10" y="2" width="4" height="6" rx="2" fill="#FFFFFF" stroke="#21242E" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Speech Bubble Frame (with pointer tail pointing to Mario) -->
  <g transform="translate(74, 18)">
    <!-- Speech bubble drop-shadow line -->
    <rect x="2" y="2" width="158" height="46" rx="10" fill="#3D4F97" />
    <!-- Main white bubble body -->
    <rect x="0" y="0" width="158" height="46" rx="10" fill="#FFFFFF" stroke="#3D4F97" stroke-width="2"/>
    
    <!-- Bubble Pointer Tail -->
    <path d="M-8 22 L0 16 L0 28 Z" fill="#FFFFFF"/>
    <path d="M-8 22 L0 16" stroke="#3D4F97" stroke-width="2"/>
    <path d="M-8 22 L0 28" stroke="#3D4F97" stroke-width="2"/>
    
    <!-- Speech Text -->
    <text x="79" y="19" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#E60012" text-anchor="middle" letter-spacing="0.5">
      WELCOME TO
    </text>
    <text x="79" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="12" fill="#21242E" text-anchor="middle" letter-spacing="0.5">
      DAYOUNG.COM!
    </text>
  </g>
</svg>