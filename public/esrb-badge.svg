<svg width="130" height="40" viewBox="0 0 130 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Amber Beveled Badge Chassis -->
  <rect x="0" y="0" width="130" height="40" rx="3" fill="#ECAB37" stroke="#3D4F97" stroke-width="1.5"/>
  <line x1="1" y1="1" x2="129" y2="1" stroke="#FDE68A" stroke-width="1.5"/>
  <line x1="1" y1="1" x2="1" y2="39" stroke="#FDE68A" stroke-width="1.5"/>

  <!-- Left Black ESRB Box -->
  <rect x="4" y="4" width="32" height="32" rx="2" fill="#21242E"/>
  <text x="20" y="24" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">
    E
  </text>
  <text x="20" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="6" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    ESRB
  </text>

  <!-- Right Text Description -->
  <text x="42" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="8.5" fill="#21242E" letter-spacing="0.5">
    PRIVACY
  </text>
  <text x="42" y="26" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="8.5" fill="#21242E" letter-spacing="0.5">
    CERTIFIED
  </text>
  <text x="42" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="6.5" fill="#3D4F97" letter-spacing="0.2">
    WEB SITE SEAL
  </text>
</svg>