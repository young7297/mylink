<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Circuit grid lines -->
    <pattern id="circuits" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 15 L 15 15 L 20 20 L 30 20 M 15 0 L 15 15" stroke="#3D4F97" stroke-width="1" stroke-opacity="0.3" fill="none"/>
      <circle cx="20" cy="20" r="2" fill="#3D4F97" fill-opacity="0.4"/>
    </pattern>
    <!-- Screen gradient -->
    <linearGradient id="lcd-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#849483"/>
      <stop offset="100%" stop-color="#9CB39A"/>
    </linearGradient>
  </defs>

  <!-- Circuit backdrop -->
  <rect width="400" height="240" fill="#206479" fill-opacity="0.15"/>
  <rect width="400" height="240" fill="url(#circuits)"/>

  <!-- Console Chassis Body (Indigo / Periwinkle Beveled Shell) -->
  <g transform="translate(40, 20)">
    <!-- Base chamfered shell with shadow line -->
    <path d="M 30 0 L 290 0 C 315 0, 325 35, 325 90 C 325 150, 310 190, 280 190 L 40 190 C 10 190, 0 150, 0 90 C 0 35, 10 0, 30 0 Z" fill="#3D4F97" />
    <!-- Raised periwinkle body plate -->
    <path d="M 28 2 L 288 2 C 312 2, 321 35, 321 88 C 321 146, 307 186, 278 186 L 38 186 C 11 186, 3 146, 3 88 C 3 35, 11 2, 28 2 Z" fill="#7A8ABA" stroke="#B8C7EE" stroke-width="2"/>
    
    <!-- Left Grip Ridges -->
    <line x1="12" y1="60" x2="12" y2="120" stroke="#3D4F97" stroke-width="2"/>
    <line x1="16" y1="65" x2="16" y2="115" stroke="#B8C7EE" stroke-width="1.5"/>
    <!-- Right Grip Ridges -->
    <line x1="310" y1="60" x2="310" y2="120" stroke="#3D4F97" stroke-width="2"/>
    <line x1="306" y1="65" x2="306" y2="115" stroke="#B8C7EE" stroke-width="1.5"/>

    <!-- Screen Bezel Outer Frame (Carbon Navy with Halftone Vibe) -->
    <rect x="75" y="24" width="170" height="135" rx="10" fill="#21242E" stroke="#3D4F97" stroke-width="2"/>
    
    <!-- Screen Header Text -->
    <text x="160" y="40" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#9FBEE7" text-anchor="middle" letter-spacing="1">
      DAYOUNG CONSOLE ADVANCE
    </text>

    <!-- Power LED -->
    <circle cx="92" cy="38" r="3" fill="#22C55E" stroke="#15803D" stroke-width="1"/>
    <circle cx="91" cy="37" r="1" fill="#FFFFFF"/>

    <!-- LCD Screen Inset -->
    <rect x="87" y="48" width="146" height="98" rx="4" fill="url(#lcd-screen)" stroke="#172554" stroke-width="2"/>
    
    <!-- Screen Content: Retro 8-bit / Pixel Portfolio Preview -->
    <g transform="translate(93, 54)">
      <!-- Pixel Mario style jump or code view -->
      <rect x="10" y="8" width="114" height="18" fill="#21242E" rx="2"/>
      <text x="67" y="20" font-family="monospace" font-weight="900" font-size="8" fill="#FDE047" text-anchor="middle">
        ★ STACK: REACT + NEXTJS ★
      </text>
      
      <!-- Mini avatar & level display -->
      <rect x="10" y="32" width="30" height="30" fill="#3D4F97" rx="2"/>
      <text x="25" y="52" font-family="Arial" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">
        DY
      </text>
      
      <text x="46" y="42" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#1E293B">
        LV.2026 JUNIOR DEV
      </text>
      <text x="46" y="54" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#1E293B">
        HP: 999/999 | EXP: MAX
      </text>

      <!-- Progress bar -->
      <rect x="46" y="60" width="76" height="7" fill="#21242E" rx="2"/>
      <rect x="47" y="61" width="60" height="5" fill="#F68D1F" rx="1.5"/>
    </g>

    <!-- D-Pad (Directional Pad on Left) -->
    <g transform="translate(30, 80)">
      <path d="M 12 0 L 22 0 L 22 12 L 34 12 L 34 22 L 22 22 L 22 34 L 12 34 L 12 22 L 0 22 L 0 12 L 12 12 Z" fill="#21242E" stroke="#3D4F97" stroke-width="1.5"/>
      <circle cx="17" cy="17" r="4" fill="#3D4F97"/>
      <!-- Direction arrows -->
      <polygon points="17,3 14,7 20,7" fill="#60619C"/>
      <polygon points="17,31 14,27 20,27" fill="#60619C"/>
      <polygon points="3,17 7,14 7,20" fill="#60619C"/>
      <polygon points="31,17 27,14 27,20" fill="#60619C"/>
    </g>

    <!-- A & B Action Buttons (Right) -->
    <g transform="translate(255, 78)">
      <!-- Button B -->
      <g transform="translate(5, 20)">
        <circle cx="14" cy="14" r="12" fill="#3D4F97"/>
        <circle cx="13" cy="13" r="11" fill="#A7282B" stroke="#B8C7EE" stroke-width="1.5"/>
        <text x="13" y="18" font-family="Arial" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">B</text>
      </g>
      <!-- Button A -->
      <g transform="translate(30, 0)">
        <circle cx="14" cy="14" r="12" fill="#3D4F97"/>
        <circle cx="13" cy="13" r="11" fill="#A7282B" stroke="#B8C7EE" stroke-width="1.5"/>
        <text x="13" y="18" font-family="Arial" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">A</text>
      </g>
    </g>

    <!-- Select / Start Buttons (Bottom Center) -->
    <g transform="translate(130, 168)">
      <rect x="0" y="0" width="22" height="7" rx="3.5" fill="#21242E" stroke="#3D4F97" stroke-width="1" transform="rotate(-25 11 3.5)"/>
      <text x="11" y="16" font-family="Arial" font-weight="700" font-size="6" fill="#3D4F97" text-anchor="middle">SELECT</text>

      <rect x="36" y="0" width="22" height="7" rx="3.5" fill="#21242E" stroke="#3D4F97" stroke-width="1" transform="rotate(-25 47 3.5)"/>
      <text x="47" y="16" font-family="Arial" font-weight="700" font-size="6" fill="#3D4F97" text-anchor="middle">START</text>
    </g>
  </g>
</svg>